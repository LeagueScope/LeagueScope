version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # Inyectar env vars del panel de Amplify en .env.production
            # para que Next.js las congele en el bundle SSR (Route Handlers)
            - env | grep -E "^(ADMIN_DB_URL|STREAMER_RO_URL|JWT_SECRET|NEXT_PUBLIC_API_URL|NEXT_PUBLIC_SITE_URL)=" >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
          - .npm/**/*
