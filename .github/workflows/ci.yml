name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Web (Next.js): install, lint, build
  # ─────────────────────────────────────────────────────────────────────────
  web:
    name: web · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        # Build-time env vars are required by some pages.
        # These are dummy values just for the build to succeed in CI.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

      - name: Audit (production deps only, high+ severity)
        run: npm audit --omit=dev --audit-level=high

  # ─────────────────────────────────────────────────────────────────────────
  # Backend (Express + pg): install, audit
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: backend · install + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Syntax check (src/)
        run: |
          find src -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Audit (production deps only, high+ severity)
        run: npm audit --omit=dev --audit-level=high || true
        # Non-blocking for now — flip to `run: npm audit …` (no `|| true`)
        # once the baseline is clean.
