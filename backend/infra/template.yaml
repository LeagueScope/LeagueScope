AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LeagueScope Ingestion — Lambdas + EventBridge for PandaScore data pipeline
  (auto-ingest = historical backfill; match-poller = real-time status polling)

Parameters:
  PgDsn:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string (URL-encoded)
  PandascoreToken:
    Type: String
    NoEcho: true
    Description: PandaScore API token
  AutoIngestRate:
    Type: String
    Default: 'rate(15 minutes)'
    Description: Cadence for the auto-ingest (historical) Lambda
  MatchPollerRate:
    Type: String
    Default: 'rate(2 minutes)'
    Description: Cadence for the real-time match-poller Lambda
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for Lambda ENIs (must have NAT route for internet)
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Lambda ENIs (must be allowed on RDS port 5432)
  AlertsFromAddress:
    Type: String
    Default: 'LeagueScope Alerts <alerts@leaguescope.com>'
    Description: Verified SES sender (name + address) for alert emails
  AlertsRecipient:
    Type: String
    Default: 'leaguescopeweb@gmail.com'
    Description: Recipient email for CloudWatch alerts (must be SES-verified while in sandbox)
  DigestSchedule:
    Type: String
    Default: 'cron(0 9 * * ? *)'
    Description: (LEGACY) Cron for single 09:00 digest. Kept for backward-compat;
                 the 8h cadence uses DigestSchedule00/08/16 below.
  DigestSchedule00:
    Type: String
    Default: 'cron(0 0 * * ? *)'
    Description: Cron (Europe/Madrid) para el correo de las 00:00. Cubre 16:00-00:00.
  DigestSchedule08:
    Type: String
    Default: 'cron(0 8 * * ? *)'
    Description: Cron (Europe/Madrid) para el correo de las 08:00. Cubre 00:00-08:00.
  DigestSchedule16:
    Type: String
    Default: 'cron(0 16 * * ? *)'
    Description: Cron (Europe/Madrid) para el correo de las 16:00. Cubre 08:00-16:00.
  PandascoreHourlyLimit:
    Type: Number
    Default: 10000
    Description: PandaScore API hourly call limit (for quota reference in digest)

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 512       # 512 MB is enough for DB + API calls
    Environment:
      Variables:
        NODE_ENV: production
        CURRENT_YEAR: '2026'

Resources:
  # ═══════════════════════════════════════════════════════════════════════════
  # AutoIngestFunction — Historical backfill (long-running, 15 min budget)
  # ═══════════════════════════════════════════════════════════════════════════
  AutoIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leaguescope-auto-ingest
      Handler: scripts/auto-ingest.handler
      CodeUri: ../                    # backend/ root (includes scripts/, data/, node_modules/)
      Description: Continuous PandaScore historical backfill for LeagueScope
      Timeout: 900                    # 15 minutes (Lambda max)
      Environment:
        Variables:
          PG_DSN: !Ref PgDsn
          PANDASCORE_TOKEN: !Ref PandascoreToken
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Events:
        ScheduledIngest:
          Type: Schedule
          Properties:
            Schedule: !Ref AutoIngestRate
            Name: leaguescope-auto-ingest-schedule
            Description: Trigger auto-ingest every 15 minutes
            Enabled: true
      Policies:
        - AWSLambdaVPCAccessExecutionRole        # ENI create/delete for VPC access
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: 'arn:aws:logs:*:*:*'

  # ═══════════════════════════════════════════════════════════════════════════
  # MatchPollerFunction — Real-time status tracker (short-lived, 5 min budget)
  # ═══════════════════════════════════════════════════════════════════════════
  MatchPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leaguescope-match-poller
      Handler: scripts/match-poller.handler
      CodeUri: ../
      Description: Real-time upcoming/running/finished match status poller
      Timeout: 300                    # 5 minutes per cycle (should be plenty)
      Environment:
        Variables:
          PG_DSN: !Ref PgDsn
          PANDASCORE_TOKEN: !Ref PandascoreToken
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Events:
        ScheduledPoll:
          Type: Schedule
          Properties:
            Schedule: !Ref MatchPollerRate
            Name: leaguescope-match-poller-schedule
            Description: Trigger match-poller every 2 minutes
            Enabled: true
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: 'arn:aws:logs:*:*:*'

  # ═══════════════════════════════════════════════════════════════════════════
  # AlertsTopic + AlertNotifierFunction — Pretty HTML alerts via SES
  # Flow: CloudWatch Alarm → SNS → Lambda (formats HTML) → SES → Gmail
  # ═══════════════════════════════════════════════════════════════════════════
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: leaguescope-alerts
      DisplayName: LeagueScope Alerts

  AlertNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leaguescope-alert-notifier
      Handler: scripts/alert-notifier.handler
      CodeUri: ../
      Description: Formats CloudWatch alarm SNS messages as HTML email via SES
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ALERTS_FROM: !Ref AlertsFromAddress
          ALERTS_TO: !Ref AlertsRecipient
          SES_CONFIG_SET: leaguescope-default
      # No VpcConfig: the notifier only talks to SES (public API) — keep cold starts fast
      Events:
        SnsTrigger:
          Type: SNS
          Properties:
            Topic: !Ref AlertsTopic
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: 'arn:aws:logs:*:*:*'

  # ═══════════════════════════════════════════════════════════════════════════
  # DailyDigestFunction — 09:00 Madrid summary (DB + CloudWatch → HTML email)
  # ═══════════════════════════════════════════════════════════════════════════
  DailyDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leaguescope-daily-digest
      Handler: scripts/daily-digest.handler
      CodeUri: ../
      Description: Daily system + ingestion digest email (09:00 Europe/Madrid)
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          PG_DSN: !Ref PgDsn
          ALERTS_FROM: !Ref AlertsFromAddress
          ALERTS_TO: !Ref AlertsRecipient
          SES_CONFIG_SET: leaguescope-default
          AUTO_INGEST_FN: leaguescope-auto-ingest
          MATCH_POLLER_FN: leaguescope-match-poller
          PANDASCORE_HOURLY_LIMIT: !Ref PandascoreHourlyLimit
      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricStatistics
                - cloudwatch:DescribeAlarms
              Resource: '*'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: 'arn:aws:logs:*:*:*'

  # IAM role for EventBridge Scheduler to invoke the digest Lambda
  DailyDigestSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeDailyDigest
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DailyDigestFunction.Arn

  # EventBridge Scheduler con tz nativo Europe/Madrid.
  # Se disparan 3 schedules al día (00:00 / 08:00 / 16:00), cada uno pasa
  # slotMadrid al Lambda para que calcule la ventana de 8h previa.
  DailyDigestSchedule00:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: leaguescope-digest-00
      Description: Digest 8h — slot 00:00 Madrid (cubre 16:00-00:00 día anterior)
      ScheduleExpression: !Ref DigestSchedule00
      ScheduleExpressionTimezone: Europe/Madrid
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt DailyDigestFunction.Arn
        RoleArn: !GetAtt DailyDigestSchedulerRole.Arn
        Input: '{"slotMadrid":"00"}'

  DailyDigestSchedule08:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: leaguescope-digest-08
      Description: Digest 8h — slot 08:00 Madrid (cubre 00:00-08:00)
      ScheduleExpression: !Ref DigestSchedule08
      ScheduleExpressionTimezone: Europe/Madrid
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt DailyDigestFunction.Arn
        RoleArn: !GetAtt DailyDigestSchedulerRole.Arn
        Input: '{"slotMadrid":"08"}'

  DailyDigestSchedule16:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: leaguescope-digest-16
      Description: Digest 8h — slot 16:00 Madrid (cubre 08:00-16:00)
      ScheduleExpression: !Ref DigestSchedule16
      ScheduleExpressionTimezone: Europe/Madrid
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt DailyDigestFunction.Arn
        RoleArn: !GetAtt DailyDigestSchedulerRole.Arn
        Input: '{"slotMadrid":"16"}'

  # ═══════════════════════════════════════════════════════════════════════════
  # CloudWatch alarms: alert if a Lambda errors repeatedly
  # ═══════════════════════════════════════════════════════════════════════════
  AutoIngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: leaguescope-auto-ingest-errors
      AlarmDescription: Auto-ingest Lambda is failing repeatedly
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref AutoIngestFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  MatchPollerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: leaguescope-match-poller-errors
      AlarmDescription: Match-poller Lambda is failing repeatedly
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref MatchPollerFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  AutoIngestStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: leaguescope-auto-ingest-stale
      AlarmDescription: Auto-ingest Lambda has not run in the last 2 hours
      MetricName: Invocations
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref AutoIngestFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

Outputs:
  AutoIngestArn:
    Description: Auto-ingest Lambda ARN
    Value: !GetAtt AutoIngestFunction.Arn
  AutoIngestName:
    Description: Auto-ingest Lambda function name
    Value: !Ref AutoIngestFunction
  MatchPollerArn:
    Description: Match-poller Lambda ARN
    Value: !GetAtt MatchPollerFunction.Arn
  MatchPollerName:
    Description: Match-poller Lambda function name
    Value: !Ref MatchPollerFunction
  AlertsTopicArn:
    Description: SNS topic ARN for CloudWatch alerts
    Value: !Ref AlertsTopic
  AlertNotifierName:
    Description: Alert notifier Lambda function name
    Value: !Ref AlertNotifierFunction
  DailyDigestName:
    Description: Daily digest Lambda function name
    Value: !Ref DailyDigestFunction
