AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LeagueScope Auto-Ingest — Lambda + EventBridge for continuous PandaScore ingestion

Parameters:
  PgDsn:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string (URL-encoded)
  PandascoreToken:
    Type: String
    NoEcho: true
    Description: PandaScore API token
  ScheduleRate:
    Type: String
    Default: 'rate(15 minutes)'
    Description: How often to trigger ingestion (EventBridge rate expression)

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 900          # 15 minutes (Lambda max)
    MemorySize: 512       # 512 MB is enough for DB + API calls

Resources:
  AutoIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leaguescope-auto-ingest
      Handler: scripts/auto-ingest.handler
      CodeUri: ../                    # backend/ root (includes scripts/, data/, node_modules/)
      Description: Continuous PandaScore data ingestion for LeagueScope
      Environment:
        Variables:
          PG_DSN: !Ref PgDsn
          PANDASCORE_TOKEN: !Ref PandascoreToken
          NODE_ENV: production
          CURRENT_YEAR: '2026'
      Events:
        ScheduledIngest:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleRate
            Name: leaguescope-ingest-schedule
            Description: Trigger auto-ingest every 15 minutes
            Enabled: true
      Policies:
        # CloudWatch Logs (auto-created by SAM but explicit for clarity)
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: 'arn:aws:logs:*:*:*'

  # CloudWatch alarm: alert if Lambda errors > 3 in 1 hour
  IngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: leaguescope-ingest-errors
      AlarmDescription: Auto-ingest Lambda is failing repeatedly
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref AutoIngestFunction
      Statistic: Sum
      Period: 3600        # 1 hour
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AutoIngestFunction.Arn
  FunctionName:
    Description: Lambda function name
    Value: !Ref AutoIngestFunction
  ScheduleRule:
    Description: EventBridge schedule rule
    Value: leaguescope-ingest-schedule
