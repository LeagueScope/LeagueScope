AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LeagueScope Ingestion — Lambdas + EventBridge for PandaScore data pipeline
  (auto-ingest = historical backfill; match-poller = real-time status polling)

Parameters:
  PgDsn:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string (URL-encoded)
  PandascoreToken:
    Type: String
    NoEcho: true
    Description: PandaScore API token
  AutoIngestRate:
    Type: String
    Default: 'rate(15 minutes)'
    Description: Cadence for the auto-ingest (historical) Lambda
  MatchPollerRate:
    Type: String
    Default: 'rate(1 minute)'
    Description: Cadence for the real-time match-poller Lambda
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for Lambda ENIs (must have NAT route for internet)
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Lambda ENIs (must be allowed on RDS port 5432)

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 512       # 512 MB is enough for DB + API calls
    Environment:
      Variables:
        PG_DSN: !Ref PgDsn
        PANDASCORE_TOKEN: !Ref PandascoreToken
        NODE_ENV: production
        CURRENT_YEAR: '2026'
    VpcConfig:
      SubnetIds: !Ref LambdaSubnetIds
      SecurityGroupIds:
        - !Ref LambdaSecurityGroupId

Resources:
  # ═══════════════════════════════════════════════════════════════════════════
  # AutoIngestFunction — Historical backfill (long-running, 15 min budget)
  # ═══════════════════════════════════════════════════════════════════════════
  AutoIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leaguescope-auto-ingest
      Handler: scripts/auto-ingest.handler
      CodeUri: ../                    # backend/ root (includes scripts/, data/, node_modules/)
      Description: Continuous PandaScore historical backfill for LeagueScope
      Timeout: 900                    # 15 minutes (Lambda max)
      Events:
        ScheduledIngest:
          Type: Schedule
          Properties:
            Schedule: !Ref AutoIngestRate
            Name: leaguescope-auto-ingest-schedule
            Description: Trigger auto-ingest every 15 minutes
            Enabled: true
      Policies:
        - AWSLambdaVPCAccessExecutionRole        # ENI create/delete for VPC access
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: 'arn:aws:logs:*:*:*'

  # ═══════════════════════════════════════════════════════════════════════════
  # MatchPollerFunction — Real-time status tracker (short-lived, 5 min budget)
  # ═══════════════════════════════════════════════════════════════════════════
  MatchPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leaguescope-match-poller
      Handler: scripts/match-poller.handler
      CodeUri: ../
      Description: Real-time upcoming/running/finished match status poller
      Timeout: 300                    # 5 minutes per cycle (should be plenty)
      Events:
        ScheduledPoll:
          Type: Schedule
          Properties:
            Schedule: !Ref MatchPollerRate
            Name: leaguescope-match-poller-schedule
            Description: Trigger match-poller every 1 minute
            Enabled: true
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: 'arn:aws:logs:*:*:*'

  # ═══════════════════════════════════════════════════════════════════════════
  # CloudWatch alarms: alert if a Lambda errors repeatedly
  # ═══════════════════════════════════════════════════════════════════════════
  AutoIngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: leaguescope-auto-ingest-errors
      AlarmDescription: Auto-ingest Lambda is failing repeatedly
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref AutoIngestFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  MatchPollerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: leaguescope-match-poller-errors
      AlarmDescription: Match-poller Lambda is failing repeatedly
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref MatchPollerFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  AutoIngestArn:
    Description: Auto-ingest Lambda ARN
    Value: !GetAtt AutoIngestFunction.Arn
  AutoIngestName:
    Description: Auto-ingest Lambda function name
    Value: !Ref AutoIngestFunction
  MatchPollerArn:
    Description: Match-poller Lambda ARN
    Value: !GetAtt MatchPollerFunction.Arn
  MatchPollerName:
    Description: Match-poller Lambda function name
    Value: !Ref MatchPollerFunction
